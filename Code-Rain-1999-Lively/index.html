const FILM_COLOUR = "#00A651";   // "Movie" preset, hand-matched to the film scene
function derive(h) {
  const c = hex(h), sc = k => c.map(v => v * k);
  return { c1: sc(0.12), c2: sc(0.6), c3: c, cur: c.map(v => v + (1 - v) * 0.75), bg: hex(CFG.background) };
}
function currentPalette() {
  if (CFG.palette === 1) return derive(FILM_COLOUR);
  if (CFG.palette === 2) return derive(CFG.custom);
  const p = PALETTES[0];
  return { c1: hex(p.c1), c2: hex(p.c2), c3: hex(p.c3), cur: hex(p.cur), bg: hex(p.bg) };
}

// depth planes: column multiplier, brightness, speed, spawn density
const PLANE_DEFS = [
  { colMul: 1.55, bright: 0.40, speed: 0.62, density: 0.85 },  // back
  { colMul: 1.00, bright: 1.00, speed: 1.00, density: 1.00 },  // mid
  { colMul: 0.62, bright: 1.00, speed: 1.40, density: 0.40 }   // front
];

const rand = Math.random;
const randGlyph = () => (rand() * GLYPH_COUNT) | 0;

// ---------- simulation ----------
let simT = 0;
let stammerUntil = 0, nextStammer = 4 + rand() * 6;

class Plane {
  constructor(def, wPx, hPx, cssW) {
    this.def = def;
    this.cols = Math.max(8, Math.round(CFG.columns * def.colMul * cssW / 1920));
    this.cell = wPx / this.cols;
    this.rows = Math.ceil(hPx / this.cell);
    const n = this.cols * this.rows;
    this.glyph = new Uint8Array(n);
    this.prev = new Uint8Array(n).fill(255);
    this.changeT = new Float32Array(n);
    this.nextT = new Float32Array(n);
    this.litT = new Float32Array(n).fill(-1e9);
    this.lead = new Uint8Array(n);
    this.flash = new Uint8Array(n);
    this.state = new Uint8Array(n * 4);
    for (let i = 0; i < n; i++) this.glyph[i] = randGlyph();
    this.cursors = [];
    this.timer = new Int32Array(this.cols);
    for (let c = 0; c < this.cols; c++) this.timer[c] = (rand() * this.rows * 1.2) | 0;
    this.acc = 0;
    this.tex = null;
  }
  get tickDt() { return TRAVERSAL / this.def.speed / this.rows; }
  spawn(col) {
    const eraser = rand() < CFG.erasers;
    const c = {
      col,
      row: -1 - ((rand() * this.rows * 0.25) | 0),          // starts with invisible chars above the top
      visibleFrom: rand() < 0.35 ? (rand() * this.rows * 0.7) | 0 : 0,  // may arrive mid-flow
      eraser,
      hi: !eraser && rand() < CFG.leader,
      keep: !eraser && rand() < CFG.keepGlyphs,
      last: -1
    };
    this.cursors.push(c);
    if (!eraser && rand() < CFG.pairs) {
      // twin string: same rows, same tick, own glyphs, directly adjacent or one column apart
      const off = (rand() < 0.5 ? 1 : 2) * (rand() < 0.5 ? -1 : 1);
      const col2 = col + off;
      if (col2 >= 0 && col2 < this.cols) {
        this.cursors.push({ ...c, col: col2, keep: rand() < CFG.keepGlyphs, last: -1 });
        this.timer[col2] = Math.max(this.timer[col2], (this.rows * 0.5) | 0);
      }
    }
  }
  step() {
    const cols = this.cols, rows = this.rows;
    const keep = [];
    for (const c of this.cursors) {
      if (c.last >= 0) this.lead[c.last] = 0;
      c.row++;
      if (c.row >= rows) continue;
      if (c.row >= 0 && c.row >= c.visibleFrom) {
        const i = c.row * cols + c.col;
        if (c.eraser) {
          this.litT[i] = -1e9;   // invisible character overwrites and erases
          this.lead[i] = 0;
        } else {
          const wasLit = this.litT[i] > -1e8;
          if (!(c.keep && wasLit)) {        // rewrite: new glyph appears below the previous one
            this.glyph[i] = randGlyph();
            this.prev[i] = 255;
            this.changeT[i] = simT;
            this.nextT[i] = simT + CFG.cycle * (0.5 + rand());
          }                                 // keep: same glyph, only re-brightened
          this.litT[i] = simT;
          this.flash[i] = 1;
          if (c.hi) { this.lead[i] = 1; c.last = i; } else c.last = -1;
        }
      }
      keep.push(c);
    }
    this.cursors = keep;
    // single glyphs appear in faded gaps of a column, without a leader
    let k = CFG.pops * cols * 0.02;
    while (k > 0) {
      if (k < 1 && rand() > k) break;
      k--;
      const col = (rand() * cols) | 0, row = (rand() * rows) | 0, i = row * cols + col;
      if (this.litT[i] > -1e8) continue;
      let near = false;
      for (let d = 1; d <= 4 && !near; d++) {
        if (row - d >= 0 && this.litT[i - d * cols] > -1e8) near = true;
        else if (row + d < rows && this.litT[i + d * cols] > -1e8) near = true;
      }
      if (!near) continue;
      this.glyph[i] = randGlyph(); this.prev[i] = 255;
      this.changeT[i] = simT; this.litT[i] = simT; this.flash[i] = 0;
      this.nextT[i] = simT + CFG.cycle * (0.5 + rand());
    }
    const lo = rows * 0.35, span = rows * 0.95;
    for (let col = 0; col < cols; col++) {
      if (--this.timer[col] <= 0) {
        this.spawn(col);
        this.timer[col] = Math.max(2, ((lo + rand() * span) / this.def.density) | 0);
      }
    }
  }
  advance(dt, frozen) {
    if (frozen) return;
    this.acc += dt;
    const td = this.tickDt;
    let guard = 0;
    while (this.acc >= td && guard++ < 500) { this.acc -= td; this.step(); }
    if (guard >= 500) this.acc = 0;
  }
  buildState() {
    const n = this.cols * this.rows, st = this.state;
    const pass = TRAVERSAL / this.def.speed;
    const lifeT = CFG.lifetime > 0 ? CFG.lifetime * pass : Infinity;
    for (let i = 0; i < n; i++) {
      const age = simT - this.litT[i];
      let b = 0;
      if (this.litT[i] > -1e8 && age < lifeT + 0.5) {
        // settled glyphs keep their brightness until erased; slight falloff towards the tail
        b = CFG.body * (1 - CFG.falloff * Math.min(1, age / pass));
        if (this.flash[i]) b += (1 - b) * Math.exp(-age / 0.15);   // brief bright head
        if (age > lifeT) b *= 1 - (age - lifeT) / 0.5;       // optional lifetime fade
      }
      if (b > 0 && simT >= this.nextT[i]) {   // each cell mutates on its own clock
        const old = this.glyph[i];
        let g = randGlyph(); if (g === old) g = (g + 1) % GLYPH_COUNT;
        this.prev[i] = old; this.glyph[i] = g;
        this.changeT[i] = simT;
        this.nextT[i] = simT + CFG.cycle * (0.5 + rand());
      }
      const dis = this.prev[i] !== 255 && simT - this.changeT[i] < DISSOLVE;
      const o = i * 4;
      st[o] = b * 255;
      st[o + 1] = this.glyph[i];
      st[o + 2] = dis ? this.prev[i] : 255;
      st[o + 3] = this.lead[i] && b > 0 ? 255 : 0;
    }
  }
  scatterClocks() {
    for (let i = 0; i < this.nextT.length; i++) this.nextT[i] = simT + rand() * CFG.cycle;
  }
}

function updateStammer() {
  if (!CFG.stammer) return false;
  if (simT >= nextStammer) {
    stammerUntil = simT + 0.06 + rand() * 0.14;     // all cursors catch their breath together
    nextStammer = stammerUntil + 4 + rand() * 6;
  }
  return simT < stammerUntil;
}

// ---------- WebGL ----------
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, premultipliedAlpha: false });
if (!gl) document.getElementById("err").textContent = "WebGL2 not available.";

const VS = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

const FS_PLANE = `#version 300 es
precision highp float;
uniform sampler2D uState, uAtlas;
uniform vec2 uRes, uGrid;
uniform float uCell, uBright, uGain;
uniform vec3 uCursor, uC1, uC2, uC3;
out vec4 o;
vec3 pal(float b){
  vec3 c1=uC1, c2=uC2, c3=uC3;
  if(b<0.25) return mix(vec3(0.),c1,b/0.25);
  if(b<0.70) return mix(c1,c2,(b-0.25)/0.45);
  return mix(c2,c3,(b-0.70)/0.30);
}
float cov(float g, vec2 local, vec2 dx, vec2 dy){
  vec2 slot = vec2(mod(g,8.), floor(g/8.));
  return textureGrad(uAtlas, (slot+local)/vec2(8.,7.), dx, dy).r;
}
void main(){
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 q = px / uCell;
  vec2 dx = dFdx(q)*0.82/vec2(8.,7.), dy = dFdy(q)*0.82/vec2(8.,7.);   // before any discard
  ivec2 cell = ivec2(floor(q));
  if (cell.x >= int(uGrid.x) || cell.y >= int(uGrid.y)) discard;
  vec4 s = texelFetch(uState, cell, 0);
  if (s.r <= 0.0) discard;
  vec2 local = 0.5 + (fract(q) - 0.5) * 0.82;   // glyph fills most of its cell
  float g = floor(s.g*255.+0.5), pg = floor(s.b*255.+0.5);
  float c = cov(g, local, dx, dy);
  if (pg < 254.5) c = 0.5*c + 0.5*cov(pg, local, dx, dy);   // one-frame cross dissolve
  vec3 col = pal(clamp(s.r*c*uBright,0.,1.));
  if (s.a > 0.5) col = mix(col, uCursor, c);
  o = vec4(col*uGain, 1.);
}`;

const FS_EXTRACT = `#version 300 es
precision mediump float;
uniform sampler2D uTex; in vec2 uv; out vec4 o;
void main(){ vec3 c = texture(uTex, uv).rgb;
  float l = dot(c, vec3(.2126,.7152,.0722));
  o = vec4(c*step(0.10,l),1.); }   // hard 0.10 high pass`;

const FS_BLUR = `#version 300 es
precision mediump float;
uniform sampler2D uTex; uniform vec2 uDir; in vec2 uv; out vec4 o;
void main(){
  float w[5] = float[](0.227027,0.1945946,0.1216216,0.054054,0.016216);
  vec3 c = texture(uTex,uv).rgb*w[0];
  for(int i=1;i<5;i++){ vec2 d=uDir*float(i)*1.4;
    c += (texture(uTex,uv+d).rgb + texture(uTex,uv-d).rgb)*w[i]; }
  o = vec4(c,1.); }`;

const FS_COMP = `#version 300 es
precision highp float;
uniform sampler2D uScene, uB1, uB2; uniform float uBloom, uTime, uNoise; uniform vec3 uBg; in vec2 uv; out vec4 o;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec3 c = texture(uScene,uv).rgb;
  if (uBloom > 0.0) c += uBloom*(texture(uB1,uv).rgb*0.9 + texture(uB2,uv).rgb*1.3);
  c += uBg;
  c += (h(gl_FragCoord.xy + fract(uTime)*97.0) - 0.5) * uNoise;   // dither / grain
  o = vec4(max(c,0.),1.); }`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "p");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}

let P, atlasTex, quad, planes = [], W = 0, H = 0, fb = {};

function makeTarget(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}
function freeTarget(x) { if (x) { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); } }

function rebuild() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = window.innerWidth, cssH = window.innerHeight;
  W = Math.max(1, Math.round(cssW * dpr)); H = Math.max(1, Math.round(cssH * dpr));
  canvas.width = W; canvas.height = H;
  for (const k in fb) freeTarget(fb[k]);
  fb = {
    scene: makeTarget(W, H),
    a1: makeTarget(W >> 1, H >> 1), b1: makeTarget(W >> 1, H >> 1),
    a2: makeTarget(W >> 2, H >> 2), b2: makeTarget(W >> 2, H >> 2)
  };
  for (const pl of planes) if (pl.tex) gl.deleteTexture(pl.tex);
  const defs = [PLANE_DEFS[1]];   // one grid, all glyphs the same size
  planes = defs.map(d => new Plane(d, W, H, cssW));
  for (const pl of planes) {
    pl.tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, pl.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, pl.cols, pl.rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }
  // warm up so the screen is already raining
  const warm = TRAVERSAL * 1.6, dt = 1 / 30;
  for (let t = 0; t < warm; t += dt) {
    simT += dt;
    const fr = updateStammer();
    for (const pl of planes) pl.advance(dt, fr);
  }
  for (const pl of planes) pl.scatterClocks();
}

function pass(prog, target) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null);
  gl.viewport(0, 0, target ? target.w : W, target ? target.h : H);
  gl.useProgram(prog.p);
}
function bindTex(prog, name, unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(prog.u[name], unit);
}
const draw = () => gl.drawArrays(gl.TRIANGLES, 0, 3);

function render() {
  // scene
  pass(P.plane, fb.scene);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  bindTex(P.plane, "uAtlas", 1, atlasTex);
  gl.uniform2f(P.plane.u.uRes, W, H);
  const pal = currentPalette();
  gl.uniform3fv(P.plane.u.uCursor, pal.cur);
  gl.uniform3fv(P.plane.u.uC1, pal.c1);
  gl.uniform3fv(P.plane.u.uC2, pal.c2);
  gl.uniform3fv(P.plane.u.uC3, pal.c3);
  gl.uniform1f(P.plane.u.uGain, CFG.brightness);
  for (const pl of planes) {
    pl.buildState();
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pl.tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, pl.cols, pl.rows, gl.RGBA, gl.UNSIGNED_BYTE, pl.state);
    gl.uniform1i(P.plane.u.uState, 0);
    gl.uniform2f(P.plane.u.uGrid, pl.cols, pl.rows);
    gl.uniform1f(P.plane.u.uCell, pl.cell);
    gl.uniform1f(P.plane.u.uBright, pl.def.bright);
    draw();
  }
  gl.disable(gl.BLEND);

  if (CFG.bloom > 0) {
    pass(P.extract, fb.a1); bindTex(P.extract, "uTex", 0, fb.scene.t); draw();
    blur(fb.a1, fb.b1);
    pass(P.extract, fb.a2); bindTex(P.extract, "uTex", 0, fb.scene.t); draw();
    blur(fb.a2, fb.b2);
  }
  pass(P.comp, null);
  bindTex(P.comp, "uScene", 0, fb.scene.t);
  bindTex(P.comp, "uB1", 1, fb.a1.t);
  bindTex(P.comp, "uB2", 2, fb.a2.t);
  gl.uniform1f(P.comp.u.uBloom, CFG.bloom);
  gl.uniform1f(P.comp.u.uTime, simT);
  gl.uniform3fv(P.comp.u.uBg, pal.bg);
  gl.uniform1f(P.comp.u.uNoise, CFG.noise);
  draw();
}
function blur(a, b) {
  pass(P.blur, b); bindTex(P.blur, "uTex", 0, a.t);
  gl.uniform2f(P.blur.u.uDir, 1 / a.w, 0); draw();
  pass(P.blur, a); bindTex(P.blur, "uTex", 0, b.t);
  gl.uniform2f(P.blur.u.uDir, 0, 1 / a.h); draw();
}

// ---------- loop ----------
let last = 0, lastDraw = 0, paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { last = now; return; }
  if (CFG.fps > 0 && now - lastDraw < 1000 / CFG.fps - 2) return;
  lastDraw = now;
  const dt = Math.min(0.1, (now - (last || now)) / 1000) * CFG.speed * BASE_SPEED;
  last = now;
  simT += dt;
  const fr = updateStammer();
  for (const pl of planes) pl.advance(dt, fr);
  render();
}

function start() {
  try {
    P = { plane: program(FS_PLANE), extract: program(FS_EXTRACT), blur: program(FS_BLUR), comp: program(FS_COMP) };
  } catch (e) { document.getElementById("err").textContent = e.message; return; }
  quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const img = new Image();
  img.onload = () => {
    atlasTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    rebuild();
    requestAnimationFrame(frame);
  };
  img.src = ATLAS_SRC;
}

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (atlasTex) rebuild(); }, 250);
});

// ---------- Lively hooks ----------
function livelyPropertyListener(name, val) {
  switch (name) {
    case "speed": CFG.speed = +val; break;
    case "columns": CFG.columns = +val; if (atlasTex) rebuild(); break;
    case "bloom": CFG.bloom = +val; break;
    case "lifetime": CFG.lifetime = +val; break;
    case "body": CFG.body = +val; break;
    case "falloff": CFG.falloff = +val; break;
    case "erasers": CFG.erasers = +val; break;
    case "palette": CFG.palette = +val; break;
    case "custom": CFG.custom = String(val).slice(0, 7); break;
    case "background": CFG.background = String(val).slice(0, 7); break;
    case "noise": CFG.noise = +val; break;
    case "leader": CFG.leader = +val; break;
    case "cycle": CFG.cycle = +val; for (const pl of planes) pl.scatterClocks(); break;
    case "brightness": CFG.brightness = +val; break;
    case "fps": CFG.fps = [30, 60, 0][+val] ?? 60; break;
    case "stammer": CFG.stammer = (val === true || val === "true"); break;
    case "pairs": CFG.pairs = +val; break;
    case "pops": CFG.pops = +val; break;
    case "keepGlyphs": CFG.keepGlyphs = +val; break;
  }
}
function livelyWallpaperPlaybackChanged(data) {
  try { paused = JSON.parse(data).IsPaused; } catch (e) {}
}
window.livelyPropertyListener = livelyPropertyListener;
window.livelyWallpaperPlaybackChanged = livelyWallpaperPlaybackChanged;

if (gl) start();
</script>
